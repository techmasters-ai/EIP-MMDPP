# Ontology Layer Mapping
# Deterministic source of truth for which entity/relationship types belong to which layer.
# Used by layered extraction to build per-layer subsets.

version: "1.0.0"

layers:
  1:
    name: "Reference & Provenance"
    entity_types:
      - DOCUMENT
      - SECTION
      - FIGURE
      - TABLE
      - SPREADSHEET
      - ASSERTION

  2:
    name: "Military Equipment (DoDAF)"
    entity_types:
      - PLATFORM
      - RADAR_SYSTEM
      - MISSILE_SYSTEM
      - AIR_DEFENSE_ARTILLERY_SYSTEM
      - ELECTRONIC_WARFARE_SYSTEM
      - FIRE_CONTROL_SYSTEM
      - INTEGRATED_AIR_DEFENSE_SYSTEM
      - LAUNCHER_SYSTEM
      - WEAPON_SYSTEM
      - SUBSYSTEM
      - COMPONENT
      - ORGANIZATION

  3:
    name: "EM/RF Signal & Radar"
    entity_types:
      - FREQUENCY_BAND
      - RF_EMISSION
      - WAVEFORM
      - MODULATION
      - RF_SIGNATURE
      - SCAN_PATTERN
      - ANTENNA
      - TRANSMITTER
      - RECEIVER
      - IF_AMPLIFIER
      - SIGNAL_PROCESSING_CHAIN

  4:
    name: "Weapon / Missile / AAA"
    entity_types:
      - SEEKER
      - GUIDANCE_METHOD
      - MISSILE_PERFORMANCE
      - MISSILE_PHYSICAL_CHARACTERISTICS
      - PROPULSION_STACK
      - PROPULSION_STAGE

  5:
    name: "Operational / Capability"
    entity_types:
      - CAPABILITY
      - RADAR_PERFORMANCE
      - ENGAGEMENT_TIMELINE
      - FORCE_STRUCTURE
      - EQUIPMENT_SYSTEM
      - ASSEMBLY
      - SPECIFICATION
      - STANDARD
      - PROCEDURE
      - FAILURE_MODE
      - TEST_EVENT
