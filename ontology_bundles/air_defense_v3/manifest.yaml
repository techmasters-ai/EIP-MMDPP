bundle_key: air_defense_v3
manifest_schema_version: "1.0.0"
ontology_name: "EIP Military Equipment Ontology"
ontology_version: "3.0.0"
extraction_profile_version: "1.0.0"

passes:
  - name: radar_domain
    # Non-required: mixed-corpus documents (e.g. handwritten notes, non-radar
    # papers) legitimately have no radar content. When the LLM returns empty
    # output for this pass, that's a true negative, not a pipeline failure.
    #
    # Flat checklist-aligned schema (RADAR MDE Checklist): only RADAR_SYSTEM is
    # emitted; all antenna / RF / modulation / parametric fields are properties
    # on that single entity. Kind is ``entities`` not ``entities_and_relationships``
    # because the schema has no typed HAS_* edges.
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_domain
    template_class: RadarDomainPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: missile_domain
    # Non-required: a radar-only or non-missile document shouldn't fail the
    # pipeline just because there's nothing to extract for this domain.
    #
    # Flat checklist-aligned schema (MISSILE MDE Checklist): only MISSILE_SYSTEM
    # is emitted; guidance / seeker / propulsion stages are flat properties on
    # that single entity. No typed edges.
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_domain
    template_class: MissileDomainPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: system_links
    required: true
    kind: relationships_only
    input_mode: document_plus_entity_refs
    module: extraction_schemas.system_links
    template_class: SystemLinksPass
    primary_entity_types: []
    bridge_entity_types: []
    extracted_relationship_types: [ASSOCIATED_WITH, CUES]
    depends_on: [radar_domain, missile_domain]
    skip_if_no_upstream_endpoints: true
    skip_justification: >
      When none of the upstream domain passes produce any linkable system
      entities, there is nothing for system_links to link. Skipping is
      preferable to dispatching an LLM call that can only fail.
