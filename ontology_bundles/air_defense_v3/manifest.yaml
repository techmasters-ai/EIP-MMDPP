bundle_key: air_defense_v3
manifest_schema_version: "1.0.0"
ontology_name: "EIP Military Equipment Ontology"
ontology_version: "3.0.0"
extraction_profile_version: "1.0.0"

# B5/B6 (2026-05-28): multi-channel retrieval + post-rerank-boost fields
# (field_query_top_k, lexical_top_k, pattern_hit_limit, fallback_*,
# rerank/lexical/pattern/section/table_boost/negative weights,
# subset_schema_extraction) are NOT repeated here; they take their defaults
# from the RetrievalProfile model in app/services/ontology_bundles.py.
# Omitting defaults prevents 4-bundle drift. See plan:
# docs/superpowers/plans/2026-05-28-schema-wide-retrieval-routing-upgrade.md

passes:
  - name: radar_identity
    phase: identity
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_identity
    template_class: RadarIdentityPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: radar_power_rf
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_power_rf
    template_class: RadarPowerRfPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "magnetron"
        - "klystron"
        - "traveling wave tube"
        - "TWT"
        - "duplexer"
        - "power amplifier"
        - "RF output"
        - "average power"
        - "duty cycle"

  - name: radar_antenna
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_antenna
    template_class: RadarAntennaPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "reflector"
        - "feed horn"
        - "parabolic"
        - "phased array"
        - "sidelobe"
        - "boresight"
        - "radome"
        - "array face"
        - "aperture"

  - name: radar_timing
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_timing
    template_class: RadarTimingPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "antenna rotation"
        - "rotation period"
        - "scan rate"
        - "revisit"
        - "pulse repetition interval"
        - "interpulse"
        - "rpm"

  - name: radar_modulation
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_modulation
    template_class: RadarModulationPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "pulse compression"
        - "matched filter"
        - "chirp"
        - "Barker"
        - "coherent integration"
        - "frequency agility"
        - "phase coding"
        - "modulation on pulse"
        - "MOP"

  - name: missile_identity
    phase: identity
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_identity
    template_class: MissileIdentityPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: missile_kinematics
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_kinematics
    template_class: MissileKinematicsPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "engagement envelope"
        - "kill zone"
        - "no-escape zone"
        - "engagement boundary"
        - "intercept envelope"
        - "footprint"
        - "slant range"

  - name: missile_guidance
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_guidance
    template_class: MissileGuidancePass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "seeker"
        - "homing"
        - "midcourse"
        - "proportional navigation"
        - "command link"
        - "datalink"
        - "illuminator"
        - "gimbal"
        - "terminal phase"

  - name: missile_airframe
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_airframe
    template_class: MissileAirframePass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "fuselage"
        - "fins"
        - "canard"
        - "wingspan"
        - "fin span"
        - "control surfaces"
        - "nose cone"
        - "airframe"
        - "warhead"

  - name: missile_speed_timing
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_speed_timing
    template_class: MissileSpeedTimingPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "burnout"
        - "boost phase"
        - "coast phase"
        - "flyout"
        - "terminal velocity"
        - "supersonic"
        - "hypersonic"
        - "mach"

  - name: missile_propulsion
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_propulsion
    template_class: MissilePropulsionPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      fallback_to_full: true
      lexical_keywords:
        - "rocket motor"
        - "propellant"
        - "nozzle"
        - "specific impulse"
        - "solid propellant"
        - "liquid propellant"
        - "oxidizer"
        - "grain"
        - "thrust"
        - "fuel"

  - name: system_links
    phase: relationship
    required: true
    kind: relationships_only
    input_mode: document_plus_entity_refs
    module: extraction_schemas.system_links
    template_class: SystemLinksPass
    primary_entity_types: []
    bridge_entity_types: []
    extracted_relationship_types: [ASSOCIATED_WITH, CUES, VARIANT_OF]
    depends_on:
      - radar_identity
      - radar_power_rf
      - radar_antenna
      - radar_timing
      - radar_modulation
      - missile_identity
      - missile_kinematics
      - missile_guidance
      - missile_airframe
      - missile_speed_timing
      - missile_propulsion
    skip_if_no_upstream_endpoints: true
    skip_justification: >
      When none of the upstream domain passes produce any linkable system
      entities, there is nothing for system_links to link. Skipping is
      preferable to dispatching an LLM call that can only fail.
