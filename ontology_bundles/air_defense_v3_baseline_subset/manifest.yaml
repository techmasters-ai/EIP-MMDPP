bundle_key: air_defense_v3_baseline_subset
manifest_schema_version: "1.0.0"
ontology_name: "EIP Military Equipment Ontology"
ontology_version: "3.0.0"
extraction_profile_version: "1.0.0"

# Test-only bundle: matches the bdde417 regression baseline by running ONLY
# the 5 passes the baseline measured (radar_identity, radar_power_rf,
# missile_identity, missile_kinematics, system_links). Sibling of
# air_defense_v3 — all referenced extraction schemas live there and are
# shared by module import path. Production ingest must use air_defense_v3.
#
# B5/B6 (2026-05-28): multi-channel retrieval + post-rerank-boost fields
# (field_query_top_k, lexical_top_k, pattern_hit_limit, fallback_*,
# rerank/lexical/pattern/section/table_boost/negative weights,
# subset_schema_extraction) are NOT repeated here; they take their defaults
# from the RetrievalProfile model in app/services/ontology_bundles.py.
# Omitting defaults prevents 4-bundle drift. See plan:
# docs/superpowers/plans/2026-05-28-schema-wide-retrieval-routing-upgrade.md

passes:
  - name: radar_identity
    phase: identity
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_identity
    template_class: RadarIdentityPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: radar_power_rf
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.radar_power_rf
    template_class: RadarPowerRfPass
    primary_entity_types: [RADAR_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      unit_gate: true
      # Task 10.5 propagation 2026-05-28: uniform merged-mode knee
      # (min_sim=0.35, top_n=50, top_k=15, fallback=true). Was previously
      # the C.7d threshold-only config (0.25/500/500). Evidence:
      # docs/handoffs/2026-05-28-merged-mode-bundle-propagation.md
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      # Phase-4 guarded-ranker activation (TEST SUBSET ONLY, 2026-06-17). Calibrated by
      # scripts.fit_guarded_ranker on dataset_v2 (LODO AUROC 0.92, recall 1.0 on all 8 folds).
      # Production air_defense_v3 stays selection_mode=topk until validated in shadow.
      selection_mode: guarded_quantile
      quantile_q: 0.5
      k_min: 3
      k_max: 0
      ranker_weights:
        unit_token_count: 1.242183
        digit_density: 0.304987
        mean_top3_field_cosine: 0.272968
        max_field_cosine: 0.219610
        rerank_norm: 0.055489
      fallback_to_full: true
      lexical_keywords:
        - "magnetron"
        - "klystron"
        - "traveling wave tube"
        - "TWT"
        - "duplexer"
        - "power amplifier"
        - "RF output"
        - "average power"
        - "duty cycle"

  - name: missile_identity
    phase: identity
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_identity
    template_class: MissileIdentityPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []

  - name: missile_kinematics
    phase: field_group
    required: false
    kind: entities
    input_mode: document_only
    module: extraction_schemas.missile_kinematics
    template_class: MissileKinematicsPass
    primary_entity_types: [MISSILE_SYSTEM]
    bridge_entity_types: []
    extracted_relationship_types: []
    depends_on: []
    retrieval:
      unit_gate: true
      # Task 10.5 propagation 2026-05-28: uniform merged-mode knee
      # (min_sim=0.35, top_n=50, top_k=15, fallback=true). Was previously
      # the C.7d threshold-only config (0.25/500/500). Evidence:
      # docs/handoffs/2026-05-28-merged-mode-bundle-propagation.md
      min_similarity: 0.35
      top_n_candidates: 50
      top_k: 15
      # Phase-4 guarded-ranker activation (TEST SUBSET ONLY, 2026-06-17). Calibrated by
      # scripts.fit_guarded_ranker on dataset_v2 (LODO AUROC 0.92, recall 1.0 on all 8 folds).
      # Production air_defense_v3 stays selection_mode=topk until validated in shadow.
      selection_mode: guarded_quantile
      quantile_q: 0.5
      k_min: 3
      k_max: 0
      ranker_weights:
        unit_token_count: 1.242183
        digit_density: 0.304987
        mean_top3_field_cosine: 0.272968
        max_field_cosine: 0.219610
        rerank_norm: 0.055489
      fallback_to_full: true
      lexical_keywords:
        - "engagement envelope"
        - "kill zone"
        - "no-escape zone"
        - "engagement boundary"
        - "intercept envelope"
        - "footprint"
        - "slant range"

  - name: system_links
    phase: relationship
    required: true
    kind: relationships_only
    input_mode: document_plus_entity_refs
    module: extraction_schemas.system_links
    template_class: SystemLinksPass
    primary_entity_types: []
    bridge_entity_types: []
    extracted_relationship_types: [ASSOCIATED_WITH, CUES, VARIANT_OF]
    depends_on:
      - radar_identity
      - radar_power_rf
      - missile_identity
      - missile_kinematics
    skip_if_no_upstream_endpoints: true
    skip_justification: >
      When none of the upstream domain passes produce any linkable system
      entities, there is nothing for system_links to link. Skipping is
      preferable to dispatching an LLM call that can only fail.
